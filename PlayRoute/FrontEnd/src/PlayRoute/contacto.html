<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>contacto</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <!-- barra de navegacion -->
    <div id="navbar"></div>

    <!-- Contenido principal centrado -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center mb-2">Contáctanos</h2>
                        <p class="text-center text-muted mb-4">
                            Completa el formulario y nos pondremos en contacto contigo.
                        </p>

                        <form>
                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label fw-semibold">
                                    Correo electronico
                                </label>
                                <input type="email" class="form-control form-control-lg" id="exampleFormControlInput1"
                                    placeholder="nombre@ejemplo.com" required>
                            </div>

                            <!-- Asunto -->
                            <div class="mb-3">
                                <label for="asunto" class="form-label fw-semibold">
                                    Asunto
                                </label>
                                <input type="text" class="form-control form-control-lg" id="asunto"
                                    placeholder="¿En qué podemos ayudarte?" required>
                            </div>

                            <!-- Mensaje -->
                            <div class="mb-4">
                                <label for="exampleFormControlTextarea1" class="form-label fw-semibold">
                                    Mensaje</label>
                                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"
                                    required></textarea>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3">
                                    Enviar
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="footer"></div>
    <script src="js/componentes.js"></script>
</body>

</html>
