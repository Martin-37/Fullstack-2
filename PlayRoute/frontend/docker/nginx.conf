server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React llama /api; el navegador no necesita conocer las URLs de los contenedores.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Exponer Swagger a traves del mismo origen es opcional, pero util para la demo.
    location = /swagger-ui.html { proxy_pass http://gateway:8080; }
    location /swagger-ui/ { proxy_pass http://gateway:8080; }
    location /v3/api-docs { proxy_pass http://gateway:8080; }
    location /openapi/ { proxy_pass http://gateway:8080; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
