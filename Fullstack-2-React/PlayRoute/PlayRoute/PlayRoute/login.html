<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · PlayRoute</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <div id="navbar"></div>
    </header>

    <main class="login-main">
        <div class="login-card">
            <div class="text-center mb-4">
                <h1 class="h3 mb-1">Iniciar sesión</h1>
                <p class="text-muted mb-0" style="font-size: 0.9rem;">
                    Es opcional: puedes seguir viendo el catálogo sin una cuenta.
                </p>
            </div>

            <div id="mensajeLogin" class="alert alert-danger py-2 d-none" role="alert"></div>

            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com" required>
                    <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>

                <div class="mb-2">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="contrasena" placeholder="Tu contraseña"
                            minlength="6" required>
                        <span class="input-group-text toggle-password" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </span>
                        <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="recordarme">
                        <label class="form-check-label" for="recordarme" style="font-size: 0.9rem;">
                            Recordarme
                        </label>
                    </div>
                    <a href="#" class="link-secondary" style="font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>

            <div class="login-divider">o</div>

            <a href="index.html" class="btn btn-invitado w-100 mb-3">
                Continuar como invitado
            </a>

            <p class="text-center mb-0" style="font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="#">Regístrate</a>
            </p>
        </div>
    </main>

    <footer>
        <p> PlayRoute : Derechos Reservados 2026 &copy;</p>
    </footer>

    <!-- Los scripts van al final del body para que el HTML ya exista en el DOM -->
    <script src="js/componentes.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
